// Code de la route, Kit Boussole : dessins exacts en SVG (panneaux, carrefours, routes, voyants…)
// Deux styles dessinés : A = détaillé, C = caricatural (véhicules « vivants » avec yeux et sourire, comme les pictos A2/A4).
// Les panneaux restent EXACTS dans tous les styles (forme, couleurs, symbole) : c'est ce qu'il faut apprendre.
const CRD = (() => {
  const R = '#c8102e', BL = '#1d5fb4', JA = '#f7c600', NO = '#1a1a1a', BC = '#ffffff';
  let uid = 0; const nid = p => p + (++uid);
  // ---------- Pictogrammes utilisés dans les panneaux (boîte 100 × 100) ----------
  const pieton = (x, y, s = 1, c = NO) => `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}" stroke="${c}" stroke-linecap="round" stroke-linejoin="round"><circle cx="2" cy="-22" r="5.5" stroke="none"/><path d="M1 -15 L-2 2" stroke-width="7" fill="none"/><path d="M-2 2 L-9 18 M-2 2 L6 18" stroke-width="5.5" fill="none"/><path d="M0 -12 L-9 -2 M0 -12 L9 -4" stroke-width="4.5" fill="none"/></g>`;
  const enfant = (x, y, s = 1, c = NO) => `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}" stroke="${c}" stroke-linecap="round"><circle cx="0" cy="-16" r="5" stroke="none"/><path d="M0 -10 L0 4" stroke-width="7"/><path d="M0 4 L-6 17 M0 4 L6 17" stroke-width="5"/><path d="M0 -7 L-8 0 M0 -7 L8 0" stroke-width="4"/></g>`;
  const autoFace = (x, y, s = 1, c = NO) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-17 4 L-14 -6 Q-12 -11 -6 -11 L6 -11 Q12 -11 14 -6 L17 4 Q18 9 15 10 L-15 10 Q-18 9 -17 4Z" fill="${c}"/><rect x="-16" y="9" width="7" height="6" rx="2" fill="${c}"/><rect x="9" y="9" width="7" height="6" rx="2" fill="${c}"/><path d="M-11 -2 L-9 -7 L9 -7 L11 -2Z" fill="#fff" opacity=".85"/></g>`;
  const fleche = (rot, c = BC, s = 1) => `<g transform="translate(50 50) rotate(${rot}) scale(${s})" fill="${c}"><path d="M-7 26 L-7 -6 L-18 -6 L0 -28 L18 -6 L7 -6 L7 26Z"/></g>`;
  // ---------- Les formes de panneaux ----------
  const triangle = (inner, fond = BC, bord = R) => `<path d="M50 7 L94 85 Q96 90 90 90 L10 90 Q4 90 6 85 Z" fill="${fond}" stroke="${bord}" stroke-width="8" stroke-linejoin="round"/><path d="M50 7 L94 85 Q96 90 90 90 L10 90 Q4 90 6 85 Z" fill="none" stroke="#fff" stroke-width="1.5" transform="translate(50 50) scale(1.09) translate(-50 -50)" opacity=".9"/>${inner}`;

const FORMES = LEX.flatMap((m, i) => m.formes.map(f => [f, i])).sort((a, b) => b[0].length - a[0].length);
const reFormes = new RegExp('(^|[^\\p{L}])(' + FORMES.map(([f]) => f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?=[^\\p{L}]|$)', 'giu');
function souligner(t) {

  const vus = new Set(); let out = '', last = 0; const s = String(t);
  s.replace(reFormes, (m, avant, f, pos) => { const i = (FORMES.find(([x]) => x.toLowerCase() === f.toLowerCase()) || [])[1]; const deb = pos + avant.length;
    out += esc(s.slice(last, deb)); if (i != null && !vus.has(i)) { vus.add(i); out += `<span class="mot-lex" data-mot="${i}" tabindex="0">${esc(f)}</span>`; } else out += esc(f); last = deb + f.length; return m; });
  return out + esc(s.slice(last));
}

}

// Une série : question → réponse → correction tout de suite. En Pas à pas (ou erreurs), une question ratée revient à la fin.

  const etat = { liste: liste.slice(), i: 0, bons: 0, total: liste.length, ratees: [], deja: new Set(), debut: Date.now() };
  const d = D(); d.series.push({ date: new Date().toISOString(), titre: o.titre, n: liste.length }); d.series = d.series.slice(-60); sauver(d);

}

function tirerExamen(n) {
  // 16/11 : chaque nouvel examen blanc prend d'abord les questions qui n'étaient pas dans les derniers examens (n°1, n°2… différents)
  const recents = new Set(D().examens.slice(-3).flatMap(e => e.ids || [])), neuves = l => [...l.filter(q => !recents.has(q.id)), ...l.filter(q => recents.has(q.id))];
  const parTheme = {}; CR_THEMES.forEach(t => parTheme[t.id] = neuves(melange(QUESTIONS.filter(q => q.th === t.id))));
  const choisies = [];
  const minimum = n >= 40 ? 2 : n >= 20 ? 1 : 0;
  CR_THEMES.forEach(t => choisies.push(...parTheme[t.id].splice(0, minimum)));
  const reste = neuves(melange(Object.values(parTheme).flat())); const nbC = Math.round(n * .35);
  const c = reste.filter(q => q.th === 'C'), autres = reste.filter(q => q.th !== 'C');
  while (choisies.length < n && (c.length || autres.length)) { const prendreC = choisies.filter(q => q.th === 'C').length < nbC && c.length; choisies.push(prendreC ? c.shift() : (autres.shift() || c.shift())); }
  return melange(choisies.slice(0, n));
}

      <h3>La correction</h3><div class="bloc liste-corr">${rep.map((r, k) => { const q = QPAR[r.id];
        return `<div class="ligne-c"><div class="mini">${image(q.img, q.id, 'P', true)}</div><div><b>${k + 1}. ${r.ok ? '✅' : '❌'} ${esc(q.q)}</b>

function resume() {
  const d = D(), ex = d.examens.filter(e => e.vrai), derniers = ex.slice(-5);
  return { maj: d.maj || null, mode: mode(), style: style(), positionnement: d.positionnement || null,
    acquises: QUESTIONS.filter(q => acquise(q.id)).length, total: QUESTIONS.length, a_revoir: aRevoir().length,
    themes: Object.fromEntries(CR_THEMES.map(t => { const p = progressionTheme(t.id); return [t.id, { titre: t.titre, acquises: p.acquises, total: p.total }]; })),
    lecons_lues: Object.keys(d.lecons).length, lecons_total: CR_LECONS.length,
    examens: ex.length, meilleur: ex.length ? Math.max(...ex.map(e => e.score)) : null, reussis: ex.filter(e => e.reussi).length, derniers: derniers.map(e => ({ date: e.date, score: e.score })),
    themes_faibles: CR_THEMES.map(t => ({ t: t.titre, e: d.examens.slice(-5).flatMap(e => e.erreurs || []).filter(id => QPAR[id] && QPAR[id].th === t.id).length })).filter(x => x.e).sort((a, b) => b.e - a.e).slice(0, 3).map(x => x.t) };
}
function courbeExamens(ex) {
  if (ex.length < 2) return '';
  const w = 600, h = 160, pad = 26, x = i => pad + i * (w - 2 * pad) / (ex.length - 1), y = s => h - pad - (s / 40) * (h - 2 * pad);
  return `<svg class="courbe" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="${pad}" x2="${w - pad}" y1="${y(35)}" y2="${y(35)}" stroke="#1f8a6e" stroke-dasharray="6 6" stroke-width="2"/><text x="${w - pad}" y="${y(35) - 6}" text-anchor="end" font-size="13" fill="#1f8a6e" font-weight="800">35 = réussi</text><polyline fill="none" stroke="#264c9a" stroke-width="4" stroke-linejoin="round" points="${ex.map((e, i) => x(i) + ',' + y(e.score)).join(' ')}"/>${ex.map((e, i) => `<circle cx="${x(i)}" cy="${y(e.score)}" r="6" fill="${e.score >= 35 ? '#1f8a6e' : '#e5622e'}"/>`).join('')}</svg>`;
}
function resultats() {
  const d = D(), r = resume(), ex = d.examens.filter(e => e.vrai);
  vue_(`<h2>📈 Mes résultats</h2>
    <div class="bloc"><p style="margin-top:0"><b>${r.acquises}</b> questions acquises sur ${r.total} · <b>${r.lecons_lues}</b> leçons lues sur ${r.lecons_total} · <b>${r.a_revoir}</b> à revoir</p>
      <div class="tableau-themes">${CR_THEMES.map(t => { const p = r.themes[t.id]; return `<div class="l"><span style="font-size:24px">${t.ico}</span><div><b style="font-size:15px">${esc(t.titre)}</b><div class="jauge"><i style="width:${pct(p.acquises, p.total)}%"></i></div></div><span class="petit">${p.acquises}/${p.total}</span></div>`; }).join('')}</div></div>
    <div class="bloc"><p style="margin-top:0"><b>Mes examens blancs</b> (40 questions, chronométrés) : ${ex.length ? `${ex.length} · meilleur ${r.meilleur}/40 · ${r.reussis} réussi${r.reussis > 1 ? 's' : ''}` : 'pas encore.'}</p>${courbeExamens(ex.slice(-12))}
      ${ex.length ? `<ul>${ex.slice(-6).reverse().map(e => `<li>${new Date(e.date).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })} : <b>${e.score}/40</b> ${e.reussi ? '✅' : ''}</li>`).join('')}</ul>` : ''}
      ${r.themes_faibles.length ? `<p class="petit">À travailler en priorité : ${r.themes_faibles.map(esc).join(', ')}.</p>` : ''}</div>
    <div class="bloc"><p style="margin-top:0"><b>📤 Ma CIP</b></p>${invite || DEMO ? `<p>${DEMO ? 'Dans la démo, rien ne part. ' : ''}Sans compte Kit Boussole, montre cet écran à ta CIP, ou imprime-le.</p><button class="btn clair" data-a="imprimer">🖨️ Imprimer</button>` : `<p>Tes résultats du code sont gardés dans ton <b>Kit Boussole</b>, sur ce PC. Ta CIP les voit quand tu partages ton travail depuis le Kit (« Je partage avec ma CIP »).</p><div class="rangee"><button class="btn" data-a="kit">🧭 Ouvrir le Kit Boussole</button><button class="btn clair" data-a="imprimer">🖨️ Imprimer</button></div>`}</div>
    <div class="rangee"><button class="btn clair" data-a="retour">‹ Accueil</button></div>`);
  lier({ imprimer: () => window.print(), kit: () => { if (history.length > 1 && document.referrer) history.back(); else location.href = '../Appli-Kit-Boussole.html'; }, retour: accueil });
}

// ---------- Lien avec le Kit : résumé gardé dans le compte de la personne ----------
// Le Kit lit store 'code-route' (même navigateur, même PC). On garde aussi un petit résumé prêt à partager.
setInterval(() => { if (!invite && D().maj) store.set('code-route-resume', resume()); }, 15000);
window.addEventListener('pagehide', () => { if (!invite && D().maj) store.set('code-route-resume', resume()); });
demarrer();

</script>

<!-- Appli installable (16/11/2026). Le service worker ne garde QUE les fichiers de l'appli ; les données restent dans ce navigateur. -->
<script>
(function () {
  if (!/^https?:$/.test(location.protocol) || !('serviceWorker' in navigator)) return; // pack ACCES (.bat, file://) : rien ne change
  navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {});
  var invite = null;
  var installee = function () { return matchMedia('(display-mode: standalone)').matches || navigator.standalone; };
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); invite = e; if (installee()) return;
    try { if (sessionStorage.getItem('kb-install-ferme')) return; } catch (x) {}
    var b = document.createElement('div'); b.id = 'kb-installer';
    b.setAttribute('style', 'position:fixed;right:14px;bottom:14px;z-index:99999;display:flex;gap:6px;align-items:center;background:#0B5566;color:#fff;border-radius:999px;padding:6px 6px 6px 14px;box-shadow:0 4px 14px rgba(0,0,0,.25);font:600 15px Nunito,system-ui,sans-serif');
    b.innerHTML = '<span>📲 Installer le Code de la route sur cet appareil</span><button type="button" data-k="oui" style="border:0;border-radius:999px;padding:7px 12px;background:#E9A23B;color:#222;font:inherit;cursor:pointer">Installer</button><button type="button" data-k="non" aria-label="Fermer" style="border:0;background:transparent;color:#fff;font:inherit;font-size:18px;cursor:pointer;padding:4px 8px">✕</button>';
    b.addEventListener('click', function (ev) {
      var k = ev.target && ev.target.getAttribute('data-k'); if (!k) return;
      if (k === 'oui' && invite) { invite.prompt(); invite.userChoice.finally(function () { invite = null; b.remove(); }); }
      else { try { sessionStorage.setItem('kb-install-ferme', '1'); } catch (x) {} b.remove(); }
    });
    document.body.appendChild(b);
  });
  window.addEventListener('appinstalled', function () { var b = document.getElementById('kb-installer'); if (b) b.remove(); });
})();
</script>
